Theme.name=MyTheme
Theme.dark=false

# --- TAVOLOZZA COLORI CORE (Stile Tailwind/Shopify) ---
@background=#F8FAFC
@foreground=#0F172A

@accentColor=#4F46E5
@accentColorHover=#4338CA
@accentColorPressed=#3730A3

@disabledForeground=#94A3B8

@selectionBackground=#EEF2F6
@selectionForeground=#4F46E5

# --- GEOMETRIA E ARROTONDAMENTI ---
@arc=12
Button.arc=12
Component.arc=12
TextComponent.arc=12
CheckBox.arc=4
ProgressBar.arc=12

# --- SEPARATORI E TITOLI ---
TitledBorder.titleColor=#475569
TitledBorder.font=Segoe UI, bold, 14
Separator.foreground=#E2E8F0

# --- BARRA DEL TITOLO INTEGRATA (Window Decorations) ---
TitlePane.unifiedBackground=true
TitlePane.background=@background
TitlePane.foreground=@foreground
TitlePane.buttonHoverBackground=#E2E8F0
TitlePane.buttonPressedBackground=#CBD5E1
TitlePane.closeHoverBackground=#E81123
TitlePane.closePressedBackground=#B90E1C
TitlePane.closeHoverForeground=#FFFFFF
TitlePane.closePressedForeground=#FFFFFF

# --- TIPOGRAFIA ---
font=Segoe UI, 13
Title.font=Segoe UI, bold, 16

# --- PANNELLI E CONTENITORI ---
Panel.background=#F8FAFC
ScrollPane.background=#F8FAFC
Viewport.background=#F8FAFC
SplitPane.background=#F8FAFC

# --- COMPONENTI GENERICI (Input, ComboBox, ecc.) ---
Component.background=#FFFFFF
Component.focusedBackground=#FFFFFF
Component.borderColor=#E2E8F0
Component.focusColor=#C7D2FE
Component.hoverBorderColor=#94A3B8
Component.clearButtonHoverBackground=#F1F5F9

# --- PULSANTI (Buttons) ---
Button.background=#FFFFFF
Button.foreground=#0F172A
Button.hoverBackground=#F1F5F9
Button.pressedBackground=#E2E8F0
Button.borderColor=#E2E8F0
Button.hoverBorderColor=#CBD5E1
Button.margin=8,16,8,16
Button.minimumWidth=84

# Pulsante di Default / Primario (es. "Aggiungi al Carrello")
Button.default.background=#4F46E5
Button.default.foreground=#FFFFFF
Button.default.hoverBackground=#4338CA
Button.default.pressedBackground=#3730A3
Button.default.boldText=true
Button.default.focusColor=#C7D2FE

# --- CAMPI DI TESTO (Inputs) ---
TextField.background=#FFFFFF
TextField.foreground=#0F172A
TextField.margin=8,12,8,12
TextField.caretColor=#4F46E5
TextField.placeholderForeground=#94A3B8
PasswordField.margin=8,12,8,12

# --- COMBO BOX ---
ComboBox.background=#FFFFFF
ComboBox.buttonBackground=#F1F5F9
ComboBox.buttonEditableBackground=#FFFFFF
ComboBox.padding=8,12,8,12

# --- TABELLE ---
Table.background=#FFFFFF
Table.foreground=#0F172A
Table.gridColor=#E2E8F0
Table.selectionBackground=#EEF2F6
Table.selectionForeground=#4F46E5
Table.rowHeight=36
Table.showHorizontalLines=true
Table.showVerticalLines=false

TableHeader.background=#F1F5F9
TableHeader.foreground=#475569
TableHeader.bottomSeparatorColor=#E2E8F0
TableHeader.height=32

# --- STRUTTURA A SCHEDE ---
TabbedPane.background=#F8FAFC
TabbedPane.foreground=#475569
TabbedPane.selectedForeground=#4F46E5
TabbedPane.underlineColor=#4F46E5
TabbedPane.hoverColor=#EEF2F6
TabbedPane.tabHeight=40
TabbedPane.tabInsets=6,16,6,16
TabbedPane.contentAreaColor=#E2E8F0
TabbedPane.showTabSeparators=false

# --- BARRE DI SCORRIMENTO ---
ScrollBar.track=#F1F5F9
ScrollBar.thumb=#CBD5E1
ScrollBar.thumbHover=#94A3B8
ScrollBar.width=10

# --- LISTE E ALBERI ---
List.background=#FFFFFF
List.selectionBackground=#EEF2F6
List.selectionForeground=#4F46E5
List.cellMargins=6,12,6,12

# --- DIALOGHI ED ERRORI ---
OptionPane.background=#FFFFFF
OptionPane.messageForeground=#0F172A
ProgressBar.background=#E2E8F0
ProgressBar.foreground=#10B981
